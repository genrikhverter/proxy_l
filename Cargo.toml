[package]
name = "llm-proxy"
version = "0.2.0"
edition = "2021"
description = "Прокси к внешним LLM-провайдерам: OpenAI-совместимый API и локальная Ollama"

[lib]
name = "llm_proxy"
path = "src/lib.rs"

[[bin]]
name = "llm-proxy"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
